name: Deploy to GitHub Pages and Update Data

on:
  schedule:
    # 平日（月曜日〜金曜日）の16:00 JST (07:00 UTC) に実行
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # 手動実行を可能にする

# デプロイに必要な権限を付与
permissions:
  contents: write
  pages: write
  id-token: write

# 同時実行の制御（Pagesデプロイ用のグループ）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run scraping update
        run: node update.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 更新されたデータをステージング
          git add public/data.json public/data.js
          
          # 差分がある場合のみコミット＆プッシュを実行
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update stock data [skip ci]"
            git push
          else
            echo "No data changes detected. Skipping commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # publicフォルダの内容をWebサイトとしてアップロード
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
